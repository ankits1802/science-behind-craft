name: Map layers

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1,4"
  push:
    branches: [main]
    paths:
      - "tools/maplayers/**"
      - "tools/maplayers_fetch.py"
      - ".github/workflows/map-layers.yml"
  pull_request:
    paths:
      - "tools/maplayers/**"
      - "tools/maplayers_build.py"
      - "tools/maplayers_fetch.py"
      - "tools/tests/test_maplayers*.py"
      - ".github/workflows/map-layers.yml"

permissions:
  contents: read

concurrency:
  group: map-layers-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  BUILDS: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Rebuild the rivers, relief, mineral and small waters layers from their downloads and test them
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the geo ETL environment and what the relief test reads of the API
        if: env.BUILDS == 'true'
        run: >-
          python -m pip install --disable-pip-version-check -e etl/geo
          pytest pydantic pydantic-settings "sqlalchemy>=2.1.9" pgvector geoalchemy2
      - name: Install osmium
        if: env.BUILDS == 'true'
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Keep the ETOPO1 grid between runs, saved on main so every pull request can restore it
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: downloads/etopo1_india.asc
          key: etopo1-ice-india-v1
      - name: Keep the ETOPO1 grid in main's cache
        if: env.BUILDS != 'true'
        run: python tools/maplayers_fetch.py downloads --only etopo1
      - name: Download Natural Earth, ETOPO1, the USGS mineral sites and OpenStreetMap, each from its mirrors in turn
        if: env.BUILDS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/maplayers_fetch.py downloads
          osmium tags-filter downloads/india-latest.osm.pbf w/waterway=river,stream,dam n/waterway=dam a/water=reservoir a/landuse=reservoir -o downloads/india-waters.osm.pbf --overwrite
          osmium export downloads/india-waters.osm.pbf -o downloads/india-waters.geojsonseq -f geojsonseq --add-unique-id=type_id --overwrite
          test -s downloads/india-waters.geojsonseq || { echo "::error::the OpenStreetMap export holds no waters"; exit 1; }
          ls -la downloads
      - name: Rebuild the layers and mirror the measured ones into the API
        if: env.BUILDS == 'true'
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          python maplayers_build.py ../downloads | tee ../map-layers.txt
          if git diff --quiet -- ../frontend/public/layers/relief.json; then echo "::error::relief.json was not rewritten, so the build did not run"; exit 1; fi
      - name: Test the relief bands and the downloads, failing when a test is skipped
        if: env.BUILDS == 'true'
        working-directory: tools
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_maplayers_relief.py tests/test_maplayers.py tests/test_maplayers_waters.py tests/test_maplayers_waters_files.py tests/test_maplayers_fetch.py | tee ../map-layers-tests.txt
          if grep -q "SKIPPED" ../map-layers-tests.txt; then echo "::error::a map layer test was skipped, so the relief bands were not checked"; exit 1; fi
      - name: Say what changed
        if: always() && env.BUILDS == 'true'
        shell: bash
        run: |
          {
            echo "## Rebuilt map layers"
            echo
            git diff --stat -- frontend/public/layers backend/app/data/layers
            echo
            echo "## Small waters"
            echo
            du -sh frontend/public/layers/waters || true
            ls frontend/public/layers/waters | wc -l || true
            ls -S -l frontend/public/layers/waters | head -6 || true
            grep -l -e '"Suran"' -e 'Amanisha' frontend/public/layers/waters/*.json || true
            grep -o '"name":"[^"]*","kind":"[^"]*","districts":\[449[^]]*\][^}]*' frontend/public/layers/waters/e068n22.json frontend/public/layers/waters/e070n22.json | head -20 || true
            grep -o '"name":"[^"]*","kind":"[^"]*","districts":\[102[^]]*\][^}]*' frontend/public/layers/waters/e074n26.json | head -20 || true
            grep -o '"ref":"[^"]*","name":"[^"]*","namedBy":"[^"]*","longitude":70\.1[^}]*' frontend/public/layers/waters/e070n22.json | head -5 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the rebuilt layers
        if: always() && env.BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-layers-${{ github.run_id }}
          path: |
            frontend/public/layers
            backend/app/data/layers
            frontend/lib/server/watersTiles.ts
            map-layers.txt
            map-layers-tests.txt
          retention-days: 30
