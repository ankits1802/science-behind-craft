name: E2E production

on:
  workflow_dispatch:
    inputs:
      questions:
        description: Also ask the three known-answer questions at Detailed depth (the mordant in English and Hindi, and Kachchh's water)
        type: boolean
        default: false
      rivers_loaded:
        description: The river lines are loaded, so the water question fails without a region story
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  production:
    name: Drive production at every width
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_PRODUCTION: "1"
      E2E_BASE_URL: ${{ vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_QUESTIONS: ${{ inputs.questions && '1' || '0' }}
      E2E_RIVERS_LOADED: ${{ inputs.rivers_loaded && '1' || '0' }}
      E2E_REPORT_DIR: production-run
      E2E_RUN_ID: ${{ github.run_id }}
      E2E_WORKERS: "4"
      E2E_RETRIES: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Check the account secrets
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$E2E_EMAIL" ] || missing="$missing E2E_EMAIL"
          [ -n "$E2E_PASSWORD" ] || missing="$missing E2E_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Set the repository secrets:$missing (docs/RUNBOOK.md, E2E production run)"
            exit 1
          fi
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive production
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --project=production-desktop --project=production-tablet --project=production-phone

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-production-screenshots-${{ github.run_id }}
          path: frontend/production-run/screens
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-production-report-${{ github.run_id }}
          path: |
            frontend/production-run/*.json
            frontend/production-run/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Say when no report was written
        if: always()
        run: |
          if ! ls production-run/*.md > /dev/null 2>&1; then
            {
              echo "## E2E production"
              echo ""
              echo "No report was written. See the Drive production step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
