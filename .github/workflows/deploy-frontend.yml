name: Deploy frontend

on:
  workflow_run:
    workflows: [Deploy backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (empty = head of main)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the commit the backend deployed
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Require the Vercel settings
        run: |
          set -euo pipefail
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID WEB_ORIGIN API_BASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (secret VERCEL_TOKEN, the rest are repository variables; see docs/RUNBOOK.md)"; exit 1; }
          done
          test -f frontend/package.json || { echo "::error::frontend/package.json is missing"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the production settings and environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Assert the project and its environment
        run: |
          set -euo pipefail
          root="$(jq -r '.settings.rootDirectory // ""' .vercel/project.json)"
          [ "$root" = frontend ] || { echo "::error::the Vercel project is rooted at '$root', not frontend"; exit 1; }
          env_file=.vercel/.env.production.local
          grep -q '^NEXT_PUBLIC_API_URL=' "$env_file" || { echo "::error::NEXT_PUBLIC_API_URL is not in the production environment, or is stored as Sensitive (withheld from vercel pull)"; exit 1; }
          value="$(sed -nE 's/^NEXT_PUBLIC_API_URL="?([^"]*)"?$/\1/p' "$env_file")"
          [ "$value" = "$API_BASE_URL" ] || echo "::warning::NEXT_PUBLIC_API_URL in Vercel differs from the API_BASE_URL repository variable"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Check the API origin reached the bundle
        run: |
          set -euo pipefail
          host="${API_BASE_URL#https://}"
          if grep -rqsF "$host" .vercel/output/static .vercel/output/functions 2>/dev/null; then
            echo "bundle references $host"
          else
            echo "::warning::no built file mentions $host; the web app may not call the API"
          fi

      - name: Deploy the prebuilt output to production
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "deployment: $url"
          echo "DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke the production origin
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$WEB_ORIGIN/" || true)"
            if [ "$code" = 200 ]; then echo "$WEB_ORIGIN answered 200"; exit 0; fi
            echo "attempt $i: $code"
            sleep 10
          done
          echo "::error::$WEB_ORIGIN did not answer 200"
          exit 1
