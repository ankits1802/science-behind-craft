name: Build the web app
description: Starts the Vercel production build of main through the deploy hook kept in Parameter Store.
runs:
  using: composite
  steps:
    - name: Call the Vercel deploy hook
      shell: bash
      run: |
        set -euo pipefail
        hook="$(aws ssm get-parameter --name /kalavigyan/env/VERCEL_DEPLOY_HOOK_URL --with-decryption --query Parameter.Value --output text)"
        echo "::add-mask::$hook"
        code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST "$hook")"
        echo "the Vercel deploy hook answered $code"
        case "$code" in
          200|201) ;;
          *) echo "::error::the web app build was not started; start it from Build pages now in admin settings"; exit 1 ;;
        esac
