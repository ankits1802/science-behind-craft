name: Await the production build
description: Says whether a deploy run started the web build, then reads the commit production serves from /api/version, and with an API origin the release its API names on /health, until the site serves the given commit of main or a later one and the API serves what that build needs (the same release or a later one, or one since which main changes nothing the API serves), or the time runs out. The job checks out the repository with its whole history first.
inputs:
  commit:
    description: The commit of main production must serve (empty only reads what production serves)
    required: false
    default: ""
  trigger-run:
    description: The id of the deploy run whose web build is awaited (empty awaits the commit without asking)
    required: false
    default: ""
  web-origin:
    description: The production site, without a trailing slash
    required: true
  api-origin:
    description: The production API, without a trailing slash, whose /health names the release it runs (empty reads the site alone)
    required: false
    default: ""
  wait-seconds:
    description: How long to wait for the commit; 0 reads once
    required: false
    default: "0"
  token:
    description: A token that may read the repository's workflow runs
    required: true
outputs:
  built:
    description: success when the deploy run started the web build, failure when starting it failed, none when it started none; success when no deploy run is named
    value: ${{ steps.built.outputs.built }}
  served:
    description: The commit production serves (empty when it reports none)
    value: ${{ steps.serve.outputs.served }}
  api:
    description: The release the API names on /health (empty when it names none or no API origin is given)
    value: ${{ steps.serve.outputs.api }}
  reached:
    description: yes when production serves the commit or a later commit of main and, with an API origin, its API serves what that build needs; no otherwise
    value: ${{ steps.serve.outputs.reached }}
  waited:
    description: The seconds spent waiting
    value: ${{ steps.serve.outputs.waited }}
runs:
  using: composite
  steps:
    - name: Ask whether the deploy started the web build
      id: built
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RUN: ${{ inputs.trigger-run }}
      run: |
        set -euo pipefail
        built=success
        if [ -n "$RUN" ]; then
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "::error::trigger-run must be a workflow run id"; exit 1; }
          built="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq '[.jobs[].steps[]?] as $steps | if any($steps[]; .name == "Hand the web build to Deploy backend" and .conclusion == "success") then "none" else ([$steps[] | select(.name | startswith("Build the web app")) | .conclusion | select(. != null)] | first // "none") end')"
          case "$built" in
            success|failure) ;;
            *) built=none ;;
          esac
          echo "deploy run $RUN started the web build: $built"
        fi
        echo "built=$built" >> "$GITHUB_OUTPUT"

    - name: Read the commit production and its API serve
      id: serve
      shell: bash
      env:
        BUILT: ${{ steps.built.outputs.built }}
        EXPECTED: ${{ inputs.commit }}
        ORIGIN: ${{ inputs.web-origin }}
        API_ORIGIN: ${{ inputs.api-origin }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: bash "$GITHUB_ACTION_PATH/served.sh"
